<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin sign in · Food Rescue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../auth.css" />
  </head>
  <body data-guest-only="true">
    <main>
      <section class="intro">
        <a class="brand" href="../index.html"><span class="mark">FR</span>Food Rescue</a>
        <div>
          <h1>Admin<br /><em>control centre.</em></h1>
          <p>Manage the Food Rescue network safely and keep every rescue moving.</p>
        </div>
        <small>Administrator access only.</small>
      </section>
      <section class="card">
        <!-- Step 1: Credentials -->
        <div id="step-credentials">
          <h2>Admin sign in</h2>
          <p class="sub">Use your authorized administrator account.</p>
          <form data-api-form="login" novalidate>
            <input type="hidden" name="role" value="admin" />
            <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="admin@example.com" /></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Enter your password" /></label>
            <button type="submit">Sign in as admin</button>
          </form>
          <p class="note"><a href="../login.html">Choose a different account type</a></p>
          <p class="note"><a href="../forgot-password.html">Forgot your password?</a></p>
        </div>

      </section>
    </main>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
